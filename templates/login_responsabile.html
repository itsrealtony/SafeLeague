<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>SafeLeague - Login Responsabile</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #003366;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 51, 102, 0.2);
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #0055aa;
            margin-bottom: 30px;
            font-size: 2em;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #004080;
            font-weight: bold;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }
        .button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        .button:hover {
            background-color: #004d99;
            transform: translateY(-3px);
        }
        .logo {
            margin-bottom: 20px;
            font-size: 2.5em;
            color: #0066cc;
            font-weight: bold;
        }
        .error-message {
            color: #cc0000;
            background-color: #ffeeee;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .nav-link {
            margin-top: 20px;
            color: #0066cc;
            text-decoration: none;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SafeLeague</div>
        <h1>Login Responsabile</h1>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="{% url 'login_responsabile' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="button">Accedi</button>
        </form>

        <a href="{% url 'benvenuto' %}" class="nav-link">Torna alla pagina di benvenuto</a>
    </div>
</body>
</html>
